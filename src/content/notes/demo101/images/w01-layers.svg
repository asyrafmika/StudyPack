    <path d="M460 180 h30" stroke="#e08600" stroke-width="2"/>
    <text x="500" y="185">find the route</text>
    <path d="M460 246 h30" stroke="#5d6673" stroke-width="2"/>
    <text x="500" y="251">send the bits</text>
  </g>
